syntax = "proto3";

package dating.user.v1;

option java_multiple_files = true;
option java_package = "com.dating.hanlian.proto.user.v1";
option java_outer_classname = "UserProto";

// 保留旧 Ping，避免现在 user-service 里的 Ping 骨架立刻编译失败。
// 等真实业务 RPC 都接好后，再考虑删除这个临时服务。
service UserService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

// 用户身份服务：负责“根据登录凭证解析或创建 userId”。
// 注意：它不负责短信校验、不签 JWT，这些是 mobile-gateway 的职责。
service UserIdentityService {
  rpc ResolveOrCreateByPhone(ResolveOrCreateByPhoneRequest)
      returns (ResolveOrCreateResponse);

  rpc ResolveOrCreateByDevice(ResolveOrCreateByDeviceRequest)
      returns (ResolveOrCreateResponse);

  rpc ResolveOrCreateByThirdParty(ResolveOrCreateByThirdPartyRequest)
      returns (ResolveOrCreateResponse);

  rpc BindPhone(BindPhoneRequest) returns (BindAccountResponse);

  rpc BindThirdParty(BindThirdPartyRequest) returns (BindAccountResponse);

  rpc CheckBan(CheckBanRequest) returns (CheckBanResponse);
}

service UserProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc BatchGetProfile(BatchGetProfileRequest) returns (BatchGetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc UpsertOnboarding(UpsertOnboardingRequest) returns (UpsertOnboardingResponse);
  rpc PresignAvatarUpload(PresignAvatarUploadRequest) returns (PresignAvatarUploadResponse);
  rpc ConfirmAvatarUpload(ConfirmAvatarUploadRequest) returns (ConfirmAvatarUploadResponse);
  rpc GetUserInterests(GetUserInterestsRequest) returns (GetUserInterestsResponse);
  rpc ReplaceUserInterests(ReplaceUserInterestsRequest) returns (ReplaceUserInterestsResponse);
  rpc UpdateRegulationStatus(UpdateRegulationStatusRequest) returns (UpdateRegulationStatusResponse);
  rpc ListRegulationLogs(ListRegulationLogsRequest) returns (ListRegulationLogsResponse);
}

message ResolveOrCreateByPhoneRequest {
  // 已经由 mobile-gateway 验证过的手机号，格式建议为 E.164，例如 +8613800138000。
  string phone_e164 = 1;

  // App 名称，例如 hanlian。
  string app_name = 2;
}

message ResolveOrCreateByDeviceRequest {
  // 客户端设备标识。注意它不是绝对稳定身份，只用于快速登录 MVP。
  string device_id = 1;

  // 设备平台。
  Platform platform = 2;

  // App 名称，例如 hanlian。
  string app_name = 3;
}

message ResolveOrCreateByThirdPartyRequest {
  // 第三方平台。
  ThirdPartyPlatform platform = 1;

  // 第三方平台返回的用户唯一 ID。
  string third_party_user_id = 2;

  // App 名称，例如 hanlian。
  string app_name = 3;

  // 可选字段：例如 Google 登录时返回的 email。
  string email = 4;
}

message ResolveOrCreateResponse {
  // user-service 内部生成的用户 ID。
  int64 user_id = 1;

  // true 表示刚创建或资料未补全，需要进入 onboarding。
  bool pending = 2;

  // true 表示这次调用创建了新用户；false 表示命中已有绑定。
  bool created = 3;
}

message BindPhoneRequest {
  int64 user_id = 1;
  string phone_e164 = 2;
  string app_name = 3;
}

message BindThirdPartyRequest {
  int64 user_id = 1;
  ThirdPartyPlatform platform = 2;
  string third_party_user_id = 3;
  string app_name = 4;
  string email = 5;
}

message BindAccountResponse {
  int64 user_id = 1;
}

message CheckBanRequest {
  int64 user_id = 1;
}

message CheckBanResponse {
  bool banned = 1;

  // 机器可读原因，例如 USER_BANNED / USER_SUSPENDED / OPERATIONAL_BANNED。
  string reason = 2;

  // 封禁时间，毫秒时间戳；没有封禁时为 0。
  int64 banned_at_ms = 3;

  // 给 gateway 或客户端展示层使用的提示文案。
  string message = 4;
}

message GetProfileRequest {
  int64 user_id = 1;
}

message GetProfileResponse {
  UserProfile profile = 1;
}

message BatchGetProfileRequest {
  repeated int64 user_ids = 1;
}

message BatchGetProfileResponse {
  repeated UserProfile profiles = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  int32 age = 3;
  string bio = 4;
  string location = 5;
  string occupation = 6;
  string education = 7;
  int32 height = 8;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
}

message UpsertOnboardingRequest {
  int64 user_id = 1;
  string nickname = 2;
  int32 gender = 3;
  int32 age = 4;
  string bio = 5;
  string location = 6;
  string occupation = 7;
  string education = 8;
  int32 height = 9;
  string birthday = 10;
}

message UpsertOnboardingResponse {
  UserProfile profile = 1;
}

message PresignAvatarUploadRequest {
  int64 user_id = 1;
  string file_ext = 2;
  string content_type = 3;
  int64 content_length = 4;
}

message PresignAvatarUploadResponse {
  string upload_url = 1;
  string object_key = 2;
  int64 expire_seconds = 3;
}

message ConfirmAvatarUploadRequest {
  int64 user_id = 1;
  string object_key = 2;
}

message ConfirmAvatarUploadResponse {
  UserProfile profile = 1;
}

message GetUserInterestsRequest {
  int64 user_id = 1;
}

message GetUserInterestsResponse {
  repeated UserInterest interests = 1;
}

message ReplaceUserInterestsRequest {
  int64 user_id = 1;
  repeated UserInterest interests = 2;
}

message ReplaceUserInterestsResponse {
  repeated UserInterest interests = 1;
}

message UpdateRegulationStatusRequest {
  int64 user_id = 1;
  int32 regulation_status = 2;
  string reason = 3;
}

message UpdateRegulationStatusResponse {
  UserProfile profile = 1;
}

message ListRegulationLogsRequest {
  int64 user_id = 1;
  int32 limit = 2;
}

message ListRegulationLogsResponse {
  repeated RegulationLog logs = 1;
}

message RegulationLog {
  int64 id = 1;
  int64 user_id = 2;
  int32 before_status = 3;
  int32 after_status = 4;
  string reason = 5;
  int32 operator_type = 6;
  string operator_id = 7;
  int64 created_at_ms = 8;
}

message UserProfile {
  int64 user_id = 1;
  string app_name = 2;
  bool pending = 3;
  string nickname = 4;
  int32 gender = 5;
  int32 age = 6;
  string bio = 7;
  string location = 8;
  string occupation = 9;
  string education = 10;
  int32 height = 11;
  int32 regulation_status = 12;
  Avatar avatar = 13;
  repeated UserInterest interests = 14;
  int32 profile_completion = 15;
  repeated string missing_fields = 16;
  string birthday = 17;
}

message Avatar {
  string original_key = 1;
  string min_key = 2;
  string mid_key = 3;
  string original_url = 4;
  string min_url = 5;
  string mid_url = 6;
  string status = 7;
}

message UserInterest {
  string interest_code = 1;
  string display_name = 2;
  InterestType type = 3;
  string pic_key = 4;
  int32 sort_order = 5;
}

enum InterestType {
  INTEREST_TYPE_UNSPECIFIED = 0;
  INTEREST_TYPE_TEXT = 1;
  INTEREST_TYPE_PICTURE = 2;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_WEB = 3;
}

enum ThirdPartyPlatform {
  THIRD_PARTY_PLATFORM_UNSPECIFIED = 0;
  THIRD_PARTY_PLATFORM_GOOGLE = 1;
  THIRD_PARTY_PLATFORM_APPLE = 2;
  THIRD_PARTY_PLATFORM_WECHAT = 3;
}
